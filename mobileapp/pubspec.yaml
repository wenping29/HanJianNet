name: hanjian_mobileapp
description: "汉奸档案 · HanJianNet 移动端：浏览、检索、档案详情、修改历史与登录。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatar_default.png
    - assets/app_logo.png
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/notosanssc/NotoSansSCThin-5.ttf
          weight: 100
        - asset: assets/fonts/notosanssc/NotoSansSCLight-3.ttf
          weight: 300
        - asset: assets/fonts/notosanssc/NotoSansSC-6.ttf
          weight: 400
        - asset: assets/fonts/notosanssc/NotoSansSCMedium-4.ttf
          weight: 500
        - asset: assets/fonts/notosanssc/Noto-Sans-SC-Bold-2.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Thin-15.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-Light-10.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular-14.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium-12.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold-3.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Black-1.ttf
          weight: 900
        - asset: assets/fonts/roboto/Roboto-ThinItalic-16.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/roboto/Roboto-LightItalic-11.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/roboto/Roboto-Italic-9.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/roboto/Roboto-MediumItalic-13.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/roboto/Roboto-BoldItalic-6.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/roboto/Roboto-BlackItalic-2.ttf
          weight: 900
          style: italic
