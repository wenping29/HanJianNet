name: PRD 版本打包

# 每次修改 PRD.md（即 PRD 版本变更）后，自动对 web / admin / mobileapp 三个项目进行打包构建；
# 也支持手动触发（workflow_dispatch）。
#
# 构建产物通过 actions/upload-artifact 上传，可在工作流运行页面的 Artifacts 中下载。
# - web、admin   ：产出 dist/，zip 后上传
# - mobileapp    ：Android 产出 APK；iOS 产出未签名 Runner.app（--no-codesign，zip 后上传，不出 .ipa）

on:
  push:
    branches:
      - "PRD"
      - "prd"
    paths:
      - "PRD.md"
  workflow_dispatch:

jobs:
  build-web:
    name: 打包 Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 上传 Web 部署包
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          compression-level: 9

  build-admin:
    name: 打包 Admin 后台
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 上传 Admin 部署包
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist
          if-no-files-found: error
          compression-level: 9

  build-android:
    name: 打包 Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobileapp
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK
        run: flutter build apk --release

      - name: 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mobileapp-android-apk
          path: mobileapp/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          compression-level: 9

  build-ios:
    name: 打包 iOS（未签名）
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobileapp
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 iOS（不签名，产物为 Runner.app）
        run: |
          flutter build ios --no-codesign
          cd build/ios/iphoneos && zip -q -r Runner.app.zip Runner.app

      - name: 上传 iOS Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: mobileapp-ios-app
          path: mobileapp/build/ios/iphoneos/Runner.app.zip
          if-no-files-found: error
          compression-level: 9