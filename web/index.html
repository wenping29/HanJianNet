<!doctype html>
<html lang="zh-CN" data-theme="ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汉奸档案 · HanJianNet</title>
    <meta name="description" content="近代汉奸档案史册：集中查阅、检索、研读与协作编纂，公开、可溯源、以史为鉴。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首屏防闪烁：在 React 挂载前根据本地存储写入主题
      (function () {
        try {
          var raw = localStorage.getItem('hanjian-theme')
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null
          if (['ink', 'paper', 'cinnabar', 'bamboo'].indexOf(theme) === -1) theme = 'ink'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'ink')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
